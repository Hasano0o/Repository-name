plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bandlycell'
version = '0.2.0'

android {
  namespace "expo.modules.bandlycell"
  defaultConfig {
    versionCode 2
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  // قراءة النص من ملصق الراوتر — نسخة خدمات Google (ما تكبّر التطبيق، النموذج ينزل مرة وحدة)
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
}
